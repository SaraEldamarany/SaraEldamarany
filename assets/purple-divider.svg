<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="66" viewBox="0 0 1000 66" role="img" aria-label="Two luminous purple lines moving in opposite directions">
<defs>
 <linearGradient id="base" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#351660"/><stop offset=".5" stop-color="#7540cc"/><stop offset="1" stop-color="#351660"/></linearGradient>
 <linearGradient id="light" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#9b6cff" stop-opacity=".4"/><stop offset=".52" stop-color="#e0c6ff"/><stop offset="1" stop-color="#9b6cff" stop-opacity=".4"/></linearGradient>
 <filter id="glow" x="-5%" y="-200%" width="110%" height="500%"><feGaussianBlur stdDeviation="3"/></filter>
 <style><![CDATA[
 .forward{stroke-dasharray:220 95;animation:right 7s linear infinite}
 .reverse{stroke-dasharray:220 95;animation:left 7s linear infinite}
 @keyframes right{to{stroke-dashoffset:-630}}
 @keyframes left{to{stroke-dashoffset:630}}
 @media(prefers-reduced-motion:reduce){.forward,.reverse{animation:none}}
 ]]></style>
</defs>
<g fill="none" stroke-linecap="round">
 <path d="M20 21 H980" stroke="url(#base)" stroke-width="7" opacity=".87"/>
 <path d="M20 47 H980" stroke="url(#base)" stroke-width="7" opacity=".87"/>
 <path class="forward" d="M20 21 H980" stroke="url(#light)" stroke-width="11" opacity=".65" filter="url(#glow)"/>
 <path class="reverse" d="M20 47 H980" stroke="url(#light)" stroke-width="11" opacity=".65" filter="url(#glow)"/>
 <path class="forward" d="M20 21 H980" stroke="url(#light)" stroke-width="5"/>
 <path class="reverse" d="M20 47 H980" stroke="url(#light)" stroke-width="5"/>
</g>
</svg>